    white-space: pre-wrap;
    word-break: break-all;

  .lvl-warn  { color: #ce9178; }     /* WARN orange */
  .lvl-err   { color: #f44747; }     /* ERROR red */

  .msg  { color: #cccccc; }
  .highlight { color: #4ec9b0; }     /* filenames / paths */

  /* blinking cursor */
  #cursor {
    display: inline-block;
    width: 7px;
    height: 14px;
    background: #cccccc;
    vertical-align: text-bottom;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── Controls bar ── */
  .controls {
    background: #252526;
    border-top: 1px solid #3c3c3c;
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    font-size: 12px;
  }
  .controls button {
    background: #0e639c;
    color: #fff;
    border: none;
    padding: 4px 14px;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
  }
  .controls button:hover { background: #1177bb; }
  .controls button:disabled { opacity: 0.4; cursor: default; }
  .controls .status { opacity: 0.6; }
  .controls label { opacity: 0.7; display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .controls input[type="range"] { width: 90px; }

// ── Parse lines with timestamps ──
function parseTimestamp(line) {
  const m = line.match(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})/);
  if (!m) return null;
  return new Date(m[1].replace(' ', 'T'));
}

const entries = RAW_LOG.map(line => ({
  text: line,
  time: parseTimestamp(line)
}));

// Compute delays (ms) between consecutive lines
// Cap at 5s so the heartbeat idle periods don't make you wait forever
const MAX_DELAY = 5000;
const delays = [0];
for (let i = 1; i < entries.length; i++) {
  if (entries[i].time && entries[i - 1].time) {
    delays.push(Math.min(MAX_DELAY, Math.max(0, entries[i].time - entries[i - 1].time)));
  } else {
    delays.push(0);
  }
}

// ── Colorize a log line ──
function colorize(text) {
  // Separator lines
  if (/^[\d-]+ [\d:]+ - MONITOR - (INFO - )?[=]+$/.test(text)) {
    return `<span class="sep">${esc(text)}</span>`;
  }

  const m = text.match(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})( - )(MONITOR)( - )(INFO|WARN|ERROR)?( - )?(.*)$/);
  if (!m) return esc(text);

  const ts = `<span class="ts">${esc(m[1])}</span>`;
  const src = `<span class="src">${esc(m[3])}</span>`;
  let lvl = '';
  let msg = m[7] || '';

  if (m[5]) {
    const cls = m[5] === 'INFO' ? 'lvl-info' : m[5] === 'WARN' ? 'lvl-warn' : 'lvl-err';
    lvl = `<span class="${cls}">${esc(m[5])}</span>${esc(m[6] || '')}`;
  }

  // Highlight filenames / paths / key items in the message
  msg = esc(msg)
    .replace(/((?:[A-Za-z]:\\|\\\\)[^\s,)]+)/g, '<span class="highlight">$1</span>')
    .replace(/([\w_-]+\.(f3d|f2d|step|csv|json|nc|pdf|cps|mch|log|txt))/g, '<span class="highlight">$1</span>')
    .replace(/(NEW FILE detected:)/g, '<span style="color:#f44747;font-weight:bold">$1</span>')
    .replace(/(FOLDER MONITOR STARTED)/g, '<span style="color:#4ec9b0;font-weight:bold">$1</span>')
    .replace(/(FOLDER MONITOR STOPPED)/g, '<span style="color:#f44747;font-weight:bold">$1</span>')
    .replace(/(RUN ORDER COMMAND STARTED)/g, '<span style="color:#4ec9b0;font-weight:bold">$1</span>')
    .replace(/(MONITOR LOG INITIALIZED)/g, '<span style="color:#4ec9b0;font-weight:bold">$1</span>')
    .replace(/(ENABLED)/g, '<span style="color:#28c840;font-weight:bold">$1</span>')
    .replace(/(All operations complete[^<]*)/g, '<span style="color:#28c840;font-weight:bold">$1</span>')
    .replace(/(Order complete[^<]*)/g, '<span style="color:#28c840;font-weight:bold">$1</span>')
    .replace(/(Successfully (?:updated|generated)[^<]*)/g, '<span style="color:#28c840">$1</span>');

  return `${ts}${esc(m[2])}${src}${esc(m[4])}${lvl}<span class="msg">${msg}</span>`;
}

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ── Playback engine ──
const terminal = document.getElementById('terminal');
const btnPlay = document.getElementById('btnPlay');
const btnPause = document.getElementById('btnPause');
const btnSkip = document.getElementById('btnSkip');
const speedSlider = document.getElementById('speedSlider');
const speedLabel = document.getElementById('speedLabel');
const statusEl = document.getElementById('status');

let currentLine = 0;
let playing = false;
let timerId = null;
let speedMultiplier = 1;

// Lines that share the same timestamp get a small stagger (30ms) for visual effect
const MIN_STAGGER = 30;

function getSpeedMultiplier() {
  const v = parseInt(speedSlider.value);
  if (v <= 10) return v / 10;       // 0.1x to 1x
  return 1 + (v - 10) * 1.5;        // 1x to 16x
}

speedSlider.addEventListener('input', () => {
  speedMultiplier = getSpeedMultiplier();
  speedLabel.textContent = speedMultiplier < 1
    ? speedMultiplier.toFixed(1) + '\u00d7'
    : Math.round(speedMultiplier) + '\u00d7';
});

function appendLine(idx) {
  const div = document.createElement('div');
  div.className = 'line';
  div.innerHTML = colorize(entries[idx].text);
  // Remove old cursor
  const oldCur = terminal.querySelector('#cursor');
  if (oldCur) oldCur.remove();
  // Add cursor at end
  const cur = document.createElement('span');
  cur.id = 'cursor';
  div.appendChild(cur);
  terminal.appendChild(div);
  terminal.scrollTop = terminal.scrollHeight;
}

function scheduleNext() {
  if (currentLine >= entries.length) {
    finish();
    return;
  }
  let delay = delays[currentLine];
  if (delay === 0) delay = MIN_STAGGER;
  delay = delay / speedMultiplier;
  // Cap minimum at 10ms for responsiveness
  delay = Math.max(10, delay);

  timerId = setTimeout(() => {
    appendLine(currentLine);
    currentLine++;
    statusEl.textContent = `Line ${currentLine}/${entries.length}`;
    scheduleNext();
  }, delay);
}

function play() {
  if (currentLine >= entries.length) {
    // Reset
    terminal.innerHTML = '';
    currentLine = 0;
  }
  playing = true;
  btnPlay.disabled = true;
  btnPause.disabled = false;
  statusEl.textContent = 'Playing...';
  scheduleNext();
}

function pause() {
  playing = false;
  clearTimeout(timerId);
  btnPlay.disabled = false;
  btnPause.disabled = true;
  statusEl.textContent = `Paused at line ${currentLine}/${entries.length}`;
}

function skipToEnd() {
  clearTimeout(timerId);
  // Dump remaining lines instantly
  const oldCur = terminal.querySelector('#cursor');
  if (oldCur) oldCur.remove();
  for (let i = currentLine; i < entries.length; i++) {
    const div = document.createElement('div');
    div.className = 'line';
    div.innerHTML = colorize(entries[i].text);
    terminal.appendChild(div);
  }
  // Final cursor
  const last = terminal.lastElementChild;
  if (last) {
    const cur = document.createElement('span');
    cur.id = 'cursor';
    last.appendChild(cur);
  }
  terminal.scrollTop = terminal.scrollHeight;
  currentLine = entries.length;
  finish();
}

function finish() {
  playing = false;
  btnPlay.disabled = false;
  btnPause.disabled = true;
  btnPlay.innerHTML = '&#8635; Replay';
  statusEl.textContent = `Done \u2014 ${entries.length} lines`;
}

btnPlay.addEventListener('click', play);
btnPause.addEventListener('click', pause);
btnSkip.addEventListener('click', skipToEnd);

// Auto-play on load
play();
</script>
</body>
</html>
